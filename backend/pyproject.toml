[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # line length is the formatter's job
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "ARG"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "alembic/versions"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
