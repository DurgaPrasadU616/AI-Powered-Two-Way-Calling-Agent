# docker-compose.yml — PostgreSQL 15 via Docker (AGENT.md §3)
# If PostgreSQL is already running locally (PG 15+), Docker is optional.
# Local PG 18 detected on this machine — skip docker compose and use local PG directly.
# To use Docker: install Docker Desktop, then run `docker compose up -d`

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_calling_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calling_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-calling_agent_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calling_agent} -d ${POSTGRES_DB:-calling_agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
